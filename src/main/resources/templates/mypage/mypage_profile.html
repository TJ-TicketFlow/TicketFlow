<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{mypage/mypage_base :: mypageLayout('회원정보 수정 - 티켓플로우', '회원정보 수정', 'profile', ~{::content})}">
    <th:block th:fragment="content">

        <div th:if="${successMessage}" class="flash-msg flash-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="flash-msg" th:text="${errorMessage}"></div>

        <div class="profile-card">
            <form id="profileForm" th:action="@{/mypage/profile}" method="post">

                <div class="section-label">기본 정보</div>
                <div class="field">
                    <label>아이디</label>
                    <input type="text" th:value="${user.userId}" readonly>
                </div>
                <div class="field">
                    <label>이름</label>
                    <input type="text" th:value="${user.userName}" readonly>
                </div>
                <div class="field">
                    <label>이메일</label>
                    <input type="email" th:value="${user.userEmail}" readonly>
                </div>

                <div class="section-label" style="margin-top:32px;">비밀번호 변경</div>
                <div class="field">
                    <label>현재 비밀번호</label>
                    <input type="password" name="currentPassword" placeholder="현재 비밀번호를 입력하세요." autocomplete="current-password">
                </div>
                <div class="field">
                    <label>새 비밀번호</label>
                    <input type="password" name="newPassword" placeholder="새 비밀번호를 입력하세요." autocomplete="new-password">
                </div>
                <div class="field">
                    <label>새 비밀번호 확인</label>
                    <input type="password" name="newPasswordConfirm" placeholder="새 비밀번호를 다시 입력하세요." autocomplete="new-password">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-withdraw" onclick="confirmWithdraw()">회원탈퇴</button>
                    <div class="action-right">
                        <button type="button" class="btn-cancel" onclick="history.back()">취소</button>
                        <button type="submit" class="btn-save">저장하기</button>
                    </div>
                </div>
            </form>
        </div>
        <form id="withdrawForm" th:action="@{/mypage/withdraw}" method="post" style="display: none;"></form>
    </th:block>
</th:block>

<script>
    function confirmWithdraw() {
        if (confirm('정말 탈퇴하시겠습니까? 탈퇴 후 모든 데이터가 삭제됩니다.')) {
            // 주소창 이동(GET) 대신, 폼을 제출(POST)합니다!
            document.getElementById('withdrawForm').submit();
        }
    }

    // [추가] 새 비밀번호 확인란이 실제로는 검증되지 않던 문제 수정 (제출 전 클라이언트 측 확인)
    // 최종 검증은 서버(UserService.updatePassword)에서도 다시 한 번 수행됩니다.
    document.getElementById('profileForm').addEventListener('submit', function (e) {
        const newPw = document.querySelector('input[name="newPassword"]').value;
        const newPwConfirm = document.querySelector('input[name="newPasswordConfirm"]').value;

        if (newPw === '' && newPwConfirm === '') return; // 비밀번호 변경을 안 하는 경우는 통과

        if (newPw !== newPwConfirm) {
            e.preventDefault();
            alert('새 비밀번호가 일치하지 않습니다.');
            return;
        }

        const strongPwRegex = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>/?]).{8,}$/;
        if (!strongPwRegex.test(newPw)) {
            e.preventDefault();
            alert('새 비밀번호는 영문, 숫자, 특수문자를 모두 포함하여 8자 이상이어야 합니다.');
        }
    });
</script>
</body>
</html>
